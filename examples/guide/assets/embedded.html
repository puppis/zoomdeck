<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Embedded page</title>
<style>body{margin:0;font:16px system-ui,sans-serif;background:#f8fafc;color:#0f172a;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:12px}button{font:inherit;padding:8px 16px;border-radius:6px;border:1px solid #94a3b8;background:#fff;cursor:pointer}</style></head>
<body><p>A live page inside an <code>[[iframe]]</code>.</p><button id="b">Clicked 0 times</button>
<script>let n=0;document.getElementById('b').onclick=()=>{n+=1;document.getElementById('b').textContent=`Clicked ${n} times`};</script></body></html>
