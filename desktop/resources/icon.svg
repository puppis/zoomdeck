<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
<defs>
  <clipPath id="squircle"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity=".35"/></filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity=".28"/></filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
  <linearGradient id="indigo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b5bdb"/><stop offset="1" stop-color="#1b1f5c"/></linearGradient>
  <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#15b8c7"/><stop offset="1" stop-color="#1b3a8f"/></linearGradient>
  <linearGradient id="navy" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e2a5a"/><stop offset="1" stop-color="#0c1030"/></linearGradient>
  <linearGradient id="sunset" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff8a3d"/><stop offset=".55" stop-color="#e8336d"/><stop offset="1" stop-color="#5b2bb5"/></linearGradient>
  <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e9edf7"/></linearGradient>
  <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient>
</defs>

<g clip-path="url(#squircle)">
  <rect x="100" y="100" width="824" height="824" fill="url(#indigo)"/>
  <circle cx="690" cy="430" r="150" fill="#ffb13d" opacity=".55" filter="url(#glow)"/>
  <g fill="none" stroke-linejoin="round">
    <rect x="190" y="286" width="620" height="404" rx="30" stroke="#ffffff" stroke-opacity=".28" stroke-width="18"/>
    <rect x="368" y="330" width="440" height="286" rx="22" stroke="#ffffff" stroke-opacity=".6" stroke-width="20"/>
    <rect x="528" y="366" width="280" height="182" rx="16" stroke="#ffffff" stroke-width="22"/>
  </g>
  <rect x="528" y="366" width="280" height="182" rx="16" fill="#ffb13d" filter="url(#soft)"/>
  <rect x="100" y="100" width="824" height="412" fill="url(#sheen)"/>
</g>
</svg>
